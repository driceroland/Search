name: Midscene desktop E2E
on:
  pull_request:
    paths: ['Sources/**', 'Tests/**', 'Package.swift', 'build.sh', '.github/workflows/midscene.yml']
  push:
    branches: ["**"]
    paths: ['Sources/**', 'Tests/**', 'Package.swift', 'build.sh', '.github/workflows/midscene.yml']
  workflow_dispatch:
    inputs:
      report_source_run_id:
        description: Rebuild an existing trusted run without model calls
        type: string
        required: false
      publish_pages:
        description: Publish optional Pages reports
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: midscene-${{ github.ref }}
  cancel-in-progress: false
env:
  MIDSCENE_UPSTREAM_REPOSITORY: driceroland/Search
jobs:
  validation:
    name: Harness validation (no model secrets)
    outputs:
      upstream-repository: ${{ env.MIDSCENE_UPSTREAM_REPOSITORY }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Tests/Midscene/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: Tests/Midscene
      - run: npm run check
        working-directory: Tests/Midscene
  swift:
    name: Swift regression (no model secrets)
    if: inputs.report_source_run_id == ''
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run every Swift regression with isolated WebKit journeys
        run: python3 Tests/run-ci-tests.py
  desktop-capability:
    name: Hosted Intel macOS desktop capability (no model secrets)
    if: inputs.report_source_run_id == ''
    runs-on: macos-15-intel
    # Diagnostic evidence, not a gate for source or model-free checks.
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: Tests/Midscene
      - name: Check native desktop permissions and SDK health
        run: node --experimental-strip-types scripts/desktop-health.ts
        working-directory: Tests/Midscene
      - name: Record capability results
        if: always()
        run: cat Tests/Midscene/desktop-health/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-macos-desktop-health
          path: Tests/Midscene/desktop-health/
          retention-days: 14
  build:
    name: Build the shared Search desktop fixture
    needs: validation
    if: >-
      inputs.report_source_run_id == '' &&
      vars.MIDSCENE_DESKTOP_ENABLED == 'true' &&
      github.event_name != 'pull_request' &&
      needs.validation.outputs.upstream-repository != '' &&
      (github.repository == needs.validation.outputs.upstream-repository && github.ref == 'refs/heads/main' ||
       github.repository != needs.validation.outputs.upstream-repository && github.event_name == 'workflow_dispatch')
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Search once for all visual shards
        run: ./build.sh debug
      - name: Archive the app with executable permissions
        run: tar -czf "$RUNNER_TEMP/search-midscene-app.tar.gz" -C build/intel Search.app
      - uses: actions/upload-artifact@v4
        with:
          name: search-midscene-app-${{ github.run_attempt }}
          path: ${{ runner.temp }}/search-midscene-app.tar.gz
          retention-days: 3
  visual:
    needs: [validation, desktop-capability, build]
    # PRs never receive model credentials. Fork models require owner dispatch.
    if: >-
      inputs.report_source_run_id == '' &&
      vars.MIDSCENE_DESKTOP_ENABLED == 'true' &&
      github.event_name != 'pull_request' &&
      needs.validation.outputs.upstream-repository != '' &&
      (github.repository == needs.validation.outputs.upstream-repository && github.ref == 'refs/heads/main' ||
       github.repository != needs.validation.outputs.upstream-repository && github.event_name == 'workflow_dispatch')
    runs-on: macos-15-intel
    timeout-minutes: 35
    concurrency:
      group: midscene-dedicated-desktop
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [import, navigation]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Tests/Midscene/package-lock.json
      - run: npm ci
        working-directory: Tests/Midscene
      - name: Clear previous reports
        working-directory: Tests/Midscene
        run: node -e "require('fs').rmSync('midscene_run', {recursive:true, force:true})"
      - name: Download the shared Search app
        uses: actions/download-artifact@v4
        with:
          name: search-midscene-app-${{ github.run_attempt }}
          path: ${{ runner.temp }}/search-midscene-app
      - name: Restore the app with executable permissions
        run: |
          mkdir -p build/intel
          tar -xzf "$RUNNER_TEMP/search-midscene-app/search-midscene-app.tar.gz" -C build/intel
      - name: Run visual shard
        id: run-shard
        working-directory: Tests/Midscene
        env:
          MIDSCENE_DESKTOP_ENABLED: '1'
          MIDSCENE_SHARD: ${{ matrix.shard }}
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
        run: npm test
      - name: Preserve shard reports even on failure
        id: upload-shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midscene-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: Tests/Midscene/midscene_run/
          if-no-files-found: warn
          retention-days: 14
  reports:
    name: Merge native Midscene reports
    needs: visual
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      (needs.visual.result != 'skipped' || inputs.report_source_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      report-artifact-name: ${{ steps.upload-report.outcome == 'success' && format('midscene-combined-{0}', github.run_attempt) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: Tests/Midscene
      - name: Clear report inputs
        run: |
          rm -rf Tests/Midscene/midscene_run
          mkdir -p Tests/Midscene/midscene_run
      - name: Validate report source run
        id: source-run
        if: inputs.report_source_run_id != ''
        env:
          REPORT_SOURCE_RUN_ID: ${{ inputs.report_source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node Tests/Midscene/scripts/trusted-report-runs.mjs validate-source
      - name: Download current-attempt shard reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: midscene-shard-*-${{ steps.source-run.outputs.source_attempt || github.run_attempt }}
          path: Tests/Midscene/midscene_run
          merge-multiple: false
          run-id: ${{ inputs.report_source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Merge native reports and save the case table
        id: merge
        continue-on-error: true
        working-directory: Tests/Midscene
        env:
          MIDSCENE_SUMMARY_PATH: midscene_run/summary.md
          MIDSCENE_SOURCE_RUN_ID: ${{ inputs.report_source_run_id }}
          MIDSCENE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MIDSCENE_PRODUCER_RESULT: ${{ inputs.report_source_run_id != '' && 'success' || needs.visual.result }}
        run: npm run report
      - name: Preserve all available reports before checking completeness
        id: upload-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midscene-combined-${{ github.run_attempt }}
          include-hidden-files: true
          path: Tests/Midscene/midscene_run/
          if-no-files-found: error
          retention-days: 14
      - name: Require complete native reports
        if: steps.merge.outcome != 'success'
        run: exit 1
  available-results:
    name: Midscene results before publication
    needs: [visual, reports]
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      (needs.visual.result != 'skipped' || inputs.report_source_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Download available results
        id: report
        if: needs.reports.outputs.report-artifact-name != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.reports.outputs.report-artifact-name }}
          path: ${{ runner.temp }}/midscene-results

      - name: Show results without waiting for Pages
        if: always()
        env:
          REPORT_RESULT: ${{ needs.reports.result }}
        run: |
          if [ -f "$RUNNER_TEMP/midscene-results/summary.md" ]; then
            cat "$RUNNER_TEMP/midscene-results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Midscene results"
              echo
              echo "Report aggregation: $REPORT_RESULT. Case counts are unavailable."
              echo
              echo "[Inspect this run and available shard artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  prepare-pages:
    name: Prepare optional Midscene Pages publication
    needs: [validation, reports]
    # Publication never runs on contributor-controlled pull request code.
    # Upstream is enabled in code; each fork must opt in by its exact full name.
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish_pages) &&
      needs.validation.outputs.upstream-repository != '' &&
      (github.repository == needs.validation.outputs.upstream-repository && github.ref == 'refs/heads/main' ||
      github.repository != needs.validation.outputs.upstream-repository && github.repository == vars.MIDSCENE_PUBLISH_REPO && github.event_name == 'workflow_dispatch') &&
      needs.reports.outputs.report-artifact-name != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: read
    outputs:
      pages-artifact-name: ${{ steps.upload-pages.outcome == 'success' && steps.pages-artifact.outputs.name || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Activate Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Explain unavailable Pages configuration
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is unavailable. A maintainer must select Settings > Pages > Build and deployment > Source > GitHub Actions."

      - name: Download combined Midscene report
        if: steps.pages.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.reports.outputs.report-artifact-name }}
          path: ${{ runner.temp }}/midscene-report-shards

      - name: Find the latest published report artifact
        id: previous-report
        if: steps.pages.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node Tests/Midscene/scripts/trusted-report-runs.mjs find-previous

      - name: Download the latest published report
        if: steps.pages.outcome == 'success' && steps.previous-report.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.previous-report.outputs.name }}
          run-id: ${{ steps.previous-report.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-pages-artifact

      - name: Extract the latest published report
        if: steps.pages.outcome == 'success' && steps.previous-report.outputs.run_id != ''
        run: |
          mkdir -p "$RUNNER_TEMP/previous-pages"
          tar -xf "$RUNNER_TEMP/previous-pages-artifact/artifact.tar" -C "$RUNNER_TEMP/previous-pages"

      - name: Prepare published report
        if: steps.pages.outcome == 'success'
        run: |
          node Tests/Midscene/scripts/prepare-pages-site.mjs \
            --site "$RUNNER_TEMP/midscene-pages" \
            --reports "$RUNNER_TEMP/midscene-report-shards" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --previous "$RUNNER_TEMP/previous-pages"

      - name: Name GitHub Pages artifact
        id: pages-artifact
        if: steps.pages.outcome == 'success'
        run: echo "name=midscene-e2e-report-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Pages report
        id: upload-pages
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.pages-artifact.outputs.name }}
          path: ${{ runner.temp }}/midscene-pages
          retention-days: 90

  deploy-report:
    name: Publish Midscene HTML report
    needs: prepare-pages
    if: >-
      always() && !cancelled() &&
      needs.prepare-pages.outputs.pages-artifact-name != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: midscene-pages-report
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.prepare-pages.outputs.pages-artifact-name }}

  report-results:
    name: Midscene results
    needs: [visual, reports, prepare-pages, deploy-report]
    # Results are already visible in available-results while Pages awaits approval.
    # This Summary adds publication status and verified report links.
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      (needs.visual.result != 'skipped' || inputs.report_source_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Activate Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install the report reader
        working-directory: Tests/Midscene
        run: npm ci --ignore-scripts

      - name: Validate report source run
        id: source-run
        if: inputs.report_source_run_id != ''
        continue-on-error: true
        env:
          REPORT_SOURCE_RUN_ID: ${{ inputs.report_source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node Tests/Midscene/scripts/trusted-report-runs.mjs validate-source

      - name: Download combined Midscene report
        id: combined-report
        if: >-
          needs.reports.outputs.report-artifact-name != '' &&
          (inputs.report_source_run_id == '' || steps.source-run.outcome == 'success')
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.reports.outputs.report-artifact-name }}
          path: ${{ runner.temp }}/midscene-combined-report

      - name: Recover available shard reports
        if: >-
          steps.combined-report.outcome != 'success' &&
          (inputs.report_source_run_id == '' || steps.source-run.outcome == 'success')
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: midscene-shard-*-${{ steps.source-run.outputs.source_attempt || github.run_attempt }}
          run-id: ${{ inputs.report_source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/midscene-report-shards
          merge-multiple: false

      - name: Write the consolidated run Summary
        if: always()
        env:
          PAGE_URL: ${{ needs.deploy-report.result == 'success' && needs.deploy-report.outputs.page-url || '' }}
          REPORT_SOURCE_RUN_ID: ${{ inputs.report_source_run_id }}
          REPORTS_DIR: ${{ steps.combined-report.outcome == 'success' && 'midscene-combined-report' || 'midscene-report-shards' }}
          PRODUCER_RESULT: ${{ needs.reports.result == 'success' && (inputs.report_source_run_id != '' || needs.visual.result == 'success') && 'success' || 'failure' }}
          REPORT_RESULT: ${{ needs.reports.result }}
          PUBLICATION_RESULT: ${{ needs.prepare-pages.result == 'failure' && 'failure' || needs.deploy-report.result }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          pages_url=""
          if [ -n "$PAGE_URL" ]; then
            pages_url="${PAGE_URL%/}/runs/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/"
          fi
          export MIDSCENE_REPORT_URL="$pages_url"
          export MIDSCENE_RUN_URL="$run_url"
          export MIDSCENE_SOURCE_RUN_ID="$REPORT_SOURCE_RUN_ID"
          export MIDSCENE_PRODUCER_RESULT="$PRODUCER_RESULT"
          export MIDSCENE_REPORT_RESULT="$REPORT_RESULT"
          export MIDSCENE_PUBLICATION_RESULT="$PUBLICATION_RESULT"
          export MIDSCENE_SUMMARY_PATH="$RUNNER_TEMP/midscene-summary.md"
          reader_status=0
          npm --prefix Tests/Midscene run report -- "$RUNNER_TEMP/$REPORTS_DIR" --summary-only || reader_status=$?
          if [ -s "$MIDSCENE_SUMMARY_PATH" ]; then
            cat "$RUNNER_TEMP/midscene-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Search × Midscene · Summary unavailable"
              echo
              echo "Case counts could not be read. Aggregation: $REPORT_RESULT. Pages: $PUBLICATION_RESULT."
              echo
              echo "[Inspect this run and available artifacts]($run_url#artifacts)."
              if [[ "$REPORT_SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
                echo "[Inspect source-run artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$REPORT_SOURCE_RUN_ID#artifacts)."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          exit "$reader_status"
