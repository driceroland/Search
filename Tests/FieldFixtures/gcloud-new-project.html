<!-- url: https://console.cloud.google.com/projectcreate?previousPage=%2Fwelcome expect: none -->
<!doctype html><html><head><title>New Project – Google Cloud console</title></head><body>
<header class="cfc-platform-bar"><div role="search" class="cfc-search"><input type="text" aria-label="Search (/) for resources, docs, products, and more" placeholder="Search (/) for resources, docs, products, and more" autocomplete="off"></div>
<button aria-label="Google Account: someone@gmail.com">S</button></header>
<main><h1>New Project</h1>
<form class="p6n-form projectcreate-form" novalidate>
  <mat-form-field class="mat-mdc-form-field"><label for="p6ntest-name-input" class="mdc-floating-label">Project name</label>
  <input matinput id="p6ntest-name-input" formcontrolname="projectName" class="mat-mdc-input-element" aria-required="true" autocomplete="off" maxlength="30" required data-probe></mat-form-field>
  <p class="cfc-hint">Project ID: my-project-12345. It cannot be changed later. <button type="button">Edit</button></p>
  <div class="cfc-form-field"><span>Location *</span><button type="button" class="cfc-resource-picker">No organization</button><button type="button">Browse</button></div>
  <div class="cfc-actions"><button type="submit" class="mdc-button mat-primary">Create</button><button type="button" class="mdc-button">Cancel</button></div>
</form></main></body></html>
