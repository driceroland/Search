<!doctype html><meta charset="utf-8"><title>Cross-origin child port fixture</title>
<body>
<button id="connect-content">Fresh child connection</button><button id="send-content">Send to child</button>
<button id="roundtrip-content">Scheduled content runtime message</button>
<script>
(() => {
  const childOrigin = 'http://127.0.0.1:FIXTURE_PORT';
  const frame = document.createElement('iframe');
  frame.id = 'fixture-child';
  const bridge = { parentOrigin: location.origin, childOrigin, reports: 0, rejected: 0 };
  globalThis.__searchCrossOriginFixture = bridge;
  addEventListener('message', event => {
    if (event.source !== frame.contentWindow || event.origin !== childOrigin) { bridge.rejected++; return; }
    const value = event.data;
    if (!value || value.kind !== 'child-port-observation') return;
    // Relay observations only. The child's real ports, callbacks and independent
    // page audit remain authoritative; the parent never reconstructs counters.
    bridge.reports++;
    document.documentElement.setAttribute('data-search-port-fixture', JSON.stringify(value.state));
    globalThis.__searchPortDocumentFixture = value.audit;
  });
  for (const id of ['connect-content', 'send-content', 'roundtrip-content']) {
    const button = document.getElementById(id);
    button.addEventListener('click', () => frame.contentWindow.postMessage({
      kind: 'child-port-command', button: id, token: button.dataset.token, scheduledAt: Number(button.dataset.scheduledAt)
    }, childOrigin));
  }
  frame.src = childOrigin + '/site.html';
  document.body.appendChild(frame);
})();
</script>
